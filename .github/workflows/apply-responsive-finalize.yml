name: Finalize responsive Herdr integration

on:
  push:
    branches:
      - feat/herdr-responsive-data-plane
    paths:
      - .github/workflows/apply-responsive-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: feat/herdr-responsive-data-plane

      - name: Apply final source patches
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          source = Path("src/herdr-responsive.js")
          text = source.read_text()
          if 'forward-${label}-${attempt}.log' not in text:
              replace_once(
                  source,
                  '    const logPath = join(dir, `forward-${label}.log`);\n    const log = openSync(logPath, "a+");',
                  '    const logPath = join(dir, `forward-${label}-${attempt}.log`);\n    const log = openSync(logPath, "w+");',
              )

          test = Path("test/herdr-responsive.test.js")
          text = test.read_text()
          if "responsive port retries cannot inherit stale readiness markers" not in text:
              guard = '\n\ntest("responsive port retries cannot inherit stale readiness markers", () => {\n  const source = readFileSync(new URL("../src/herdr-responsive.js", import.meta.url), "utf8");\n  assert.match(source, /forward-\\$\\{label\\}-\\$\\{attempt\\}\\.log/);\n  assert.match(source, /openSync\\(logPath, "w\\+"\\)/);\n  assert.doesNotMatch(source, /openSync\\(logPath, "a\\+"\\)/);\n});\n'
              test.write_text(text.rstrip() + guard)

          readme = Path("README.md")
          text = readme.read_text()
          anchor = '- [`docs/THIN_HERDR_DOGFOOD.md`](./docs/THIN_HERDR_DOGFOOD.md): exact Mac -> Windows physical validation for the local-renderer persistent desk path.\n'
          if "RESPONSIVE_HERDR_DOGFOOD.md" not in text:
              if anchor not in text:
                  raise SystemExit("README dogfood anchor changed")
              readme.write_text(text.replace(anchor, anchor + '- [`docs/RESPONSIVE_HERDR_DOGFOOD.md`](./docs/RESPONSIVE_HERDR_DOGFOOD.md): isolated A/B dogfood for the experimental replicated local-terminal data plane.\n', 1))
          PY

      - name: Verify tests and static checks
        run: |
          npm test
          npm run check
          git diff --check

      - name: Commit source finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/herdr-responsive.js test/herdr-responsive.test.js README.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "source already finalized"
            exit 0
          fi
          git commit -m "fix: finalize responsive Herdr isolation"
          git push origin HEAD:feat/herdr-responsive-data-plane
