name: Build responsive Herdr runtime

on:
  push:
    branches:
      - feat/herdr-responsive-data-plane
    paths:
      - .github/workflows/herdr-responsive-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  HERDR_MIRROR_REF: 20a0cd5294fb15ef17209612d80d5a2704169990
  HERDR_MIRROR_TAG: herdr-mirror-20a0cd5294fb15ef17209612d80d5a2704169990
  RUST_TOOLCHAIN_VERSION: 1.96.1
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
  LIBGHOSTTY_VT_SIMD: "true"

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: herdr-mirror-macos-aarch64
          - target: x86_64-apple-darwin
            asset: herdr-mirror-macos-x86_64
    runs-on: macos-latest
    steps:
      - name: Checkout pinned responsive Herdr source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: rrnewton/herdr
          ref: ${{ env.HERDR_MIRROR_REF }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install patched Zig and build tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15 cmake ninja
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"

      - name: Build pinned source
        run: |
          rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out
          cargo build --release --locked --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/herdr" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Upload runtime asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout pinned responsive Herdr source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: rrnewton/herdr
          ref: ${{ env.HERDR_MIRROR_REF }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Build pinned source
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue
          cargo build --release --locked --target x86_64-pc-windows-msvc
          Copy-Item target\x86_64-pc-windows-msvc\release\herdr.exe herdr-mirror-windows-x86_64.exe
          $hash = (Get-FileHash -Algorithm SHA256 herdr-mirror-windows-x86_64.exe).Hash.ToLowerInvariant()
          "$hash  herdr-mirror-windows-x86_64.exe" | Out-File -Encoding ascii herdr-mirror-windows-x86_64.exe.sha256

      - name: Upload runtime asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-mirror-windows-x86_64
          path: |
            herdr-mirror-windows-x86_64.exe
            herdr-mirror-windows-x86_64.exe.sha256
          retention-days: 7

  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Corresponding Source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: rrnewton/herdr
          ref: ${{ env.HERDR_MIRROR_REF }}
          persist-credentials: false
          submodules: recursive

      - name: Package exact source and license
        run: |
          set -euo pipefail
          name="herdr-mirror-source-${HERDR_MIRROR_REF}"
          mkdir -p "$RUNNER_TEMP/$name"
          rsync -a --exclude '.git' --exclude 'target' ./ "$RUNNER_TEMP/$name/"
          tar -C "$RUNNER_TEMP" -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cp LICENSE HERDR-MIRROR-LICENSE.txt

      - name: Upload Corresponding Source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-mirror-source
          path: |
            herdr-mirror-source-${{ env.HERDR_MIRROR_REF }}.tar.gz
            herdr-mirror-source-${{ env.HERDR_MIRROR_REF }}.tar.gz.sha256
            HERDR-MIRROR-LICENSE.txt
          retention-days: 7

  publish:
    needs: [macos, windows, source]
    runs-on: ubuntu-latest
    steps:
      - name: Download built assets and Corresponding Source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksum sidecars
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c herdr-mirror-macos-aarch64.sha256
          sha256sum -c herdr-mirror-macos-x86_64.sha256
          sha256sum -c herdr-mirror-windows-x86_64.exe.sha256
          sha256sum -c "herdr-mirror-source-${HERDR_MIRROR_REF}.tar.gz.sha256"

      - name: Publish pinned Handoff prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Pinned build of rrnewton/herdr@${HERDR_MIRROR_REF} for Handoff responsive-mirror dogfood; not an official Herdr release. The pinned Herdr source declares AGPL-3.0-or-later (with a separate commercial-license option). Exact Corresponding Source and the upstream license are attached to this release."
          if ! gh release view "$HERDR_MIRROR_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$HERDR_MIRROR_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Responsive Herdr runtime ${HERDR_MIRROR_REF:0:7}" \
              --notes "$notes"
          else
            gh release edit "$HERDR_MIRROR_TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          fi
          gh release upload "$HERDR_MIRROR_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/herdr-mirror-macos-aarch64 \
            dist/herdr-mirror-macos-aarch64.sha256 \
            dist/herdr-mirror-macos-x86_64 \
            dist/herdr-mirror-macos-x86_64.sha256 \
            dist/herdr-mirror-windows-x86_64.exe \
            dist/herdr-mirror-windows-x86_64.exe.sha256 \
            "dist/herdr-mirror-source-${HERDR_MIRROR_REF}.tar.gz" \
            "dist/herdr-mirror-source-${HERDR_MIRROR_REF}.tar.gz.sha256" \
            dist/HERDR-MIRROR-LICENSE.txt
