name: Codex app-server Windows smoke

on:
  pull_request:
    paths:
      - src/codex-remote.js
      - src/ssh.js
      - src/index.js
      - test/codex-remote.test.js
      - .github/workflows/codex-app-server-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CODEX_VERSION: "0.150.1"
  CODEX_TAG: "rust-v0.150.1"
  CODEX_APP_SERVER_ZIP_SHA256: "15e67d35440b73a34f21c4b9cf62bdc3162daa4f970bc777107734f4bc050483"

jobs:
  windows-app-server:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify official app-server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'codex-app-server.zip'
          $url = "https://github.com/openai/codex/releases/download/$env:CODEX_TAG/codex-app-server-x86_64-pc-windows-msvc.exe.zip"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:CODEX_APP_SERVER_ZIP_SHA256) {
            throw "official Codex app-server checksum mismatch: $hash"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'codex-app-server'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -LiteralPath $dir -Recurse -File -Filter '*.exe' |
            Where-Object { $_.Name -match '^codex-app-server.*\.exe$' } |
            Select-Object -First 1
          if (-not $exe) { throw 'official Codex app-server executable was not found in the verified archive' }
          "CODEX_APP_SERVER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Start loopback server and prove readiness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()

          $stdout = Join-Path $env:RUNNER_TEMP 'codex-app-server.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'codex-app-server.err.log'
          $server = Start-Process -FilePath $env:CODEX_APP_SERVER_EXE `
            -ArgumentList @('--listen', "ws://127.0.0.1:$port") `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru `
            -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              if ($server.HasExited) {
                $detail = if (Test-Path $stderr) { Get-Content -LiteralPath $stderr -Raw } else { '' }
                throw "Codex app-server exited before readyz: $detail"
              }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/readyz" -TimeoutSec 1
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 125
            }
            if (-not $ready) {
              $detail = if (Test-Path $stderr) { Get-Content -LiteralPath $stderr -Raw } else { '' }
              throw "Codex app-server never became ready: $detail"
            }

            $connections = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction Stop)
            if ($connections.Count -lt 1) { throw 'readyz passed but no listening socket was visible' }
            $nonLoopback = @($connections | Where-Object {
              $_.LocalAddress -notin @('127.0.0.1', '::1')
            })
            if ($nonLoopback.Count -gt 0) {
              throw "Codex app-server exposed a non-loopback listener: $($nonLoopback.LocalAddress -join ', ')"
            }
            Write-Host "Codex $env:CODEX_VERSION app-server ready on loopback port $port (pid $($server.Id))"
          } finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
              $server.WaitForExit(5000) | Out-Null
            }
          }
